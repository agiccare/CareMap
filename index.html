<html lang="en">

        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>CareMap Malaysia</title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        

        <!-- ADD THIS FILTERING SCRIPT -->
        <script>
        window.addEventListener('load', function() {
            // Wait 1 second for qgis2web to fully initialize and render layers
            setTimeout(function() {
                const urlParams = new URLSearchParams(window.location.search);
                let targets = [];
                for (let i = 1; i <= 3; i++) {
                    let lat = parseFloat(urlParams.get('lat' + i));
                    let lon = parseFloat(urlParams.get('lon' + i));
                    if (!isNaN(lat) && !isNaN(lon)) {
                        targets.push({lat: lat, lon: lon});
                    }
                }

                if (targets.length > 0 && typeof map !== 'undefined') {
                    map.getLayers().forEach(function(layer) {
                        let source = layer.getSource && layer.getSource();
                        if (source && typeof source.getFeatures === 'function') {
                            source.getFeatures().forEach(function(feature) {
                                let geom = feature.getGeometry();
                                if (geom && geom.getType() === 'Point') {
                                    // qgis2web maps use Web Mercator, convert to standard lat/lon
                                    let lonLat = ol.proj.toLonLat(geom.getCoordinates());
                                    let featLon = lonLat[0];
                                    let featLat = lonLat[1];
                                    
                                    let match = targets.some(t => 
                                        Math.abs(t.lat - featLat) < 0.0005 && Math.abs(t.lon - featLon) < 0.0005
                                    );
                                    
                                    if (!match) {
                                        // Hide non-matching facility markers
                                        feature.setStyle(new ol.style.Style({}));
                                    }
                                }
                            });
                        }
                    });
                }
            }, 1000);
        });
        </script>
    </body>
</html>
       
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        
    </body>
</html>
